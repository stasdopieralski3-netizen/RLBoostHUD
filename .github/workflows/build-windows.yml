
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name RLBoostHUD rl_boost_hud.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RLBoostHUD-Windows
          path: dist/RLBoostHUD.exe
  
